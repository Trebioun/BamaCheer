backend:
  name: git-gateway
  branch: main

# Client uploads (photos) land here and are served from /images
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "content"
        label: "Landing Page Content"
        file: "data/content.json"
        fields:
          - { label: "Logo", name: "logo", widget: "image" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow (small text above title)", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "Button Link", name: "ctaLink", widget: "string" }
              - { label: "Background Image", name: "backgroundImage", widget: "image" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }

          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

          - label: "Programs"
            name: "programs"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Attribution (e.g. 'Parent, Level 3 athlete')", name: "name", widget: "string" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - label: "Locations"
                name: "locations"
                widget: "list"
                fields:
                  - { label: "Location Name", name: "name", widget: "string" }
                  - { label: "Address", name: "address", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string", required: false }
                  - { label: "Google Maps Embed URL", name: "mapEmbedSrc", widget: "string", required: false }

          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
