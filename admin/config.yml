backend:
  name: git-gateway
  branch: main

# Client uploads (photos) land here and are served from /images
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "content"
        label: "Landing Page Content"
        file: "data/content.json"
        fields:
          - { label: "Logo", name: "logo", widget: "image" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow (small text above title)", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "Button Link", name: "ctaLink", widget: "string" }
              - { label: "Background Image", name: "backgroundImage", widget: "image" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - label: "Photo Carousel"
                name: "images"
                widget: "list"
                required: false
                # No `max` is set, so this list is unlimited. label_singular
                # makes the button read "Add Photo" rather than the list's
                # own label, which reads as if the carousel itself is the
                # thing being added.
                label_singular: "Photo"
                hint: "Add as many photos as you like — there's no limit. Use \"Add Photo\" at the bottom of the list, and drag items to reorder them."
                field: { label: "Photo", name: "image", widget: "image" }

          - label: "Stats"
            name: "stats"
            widget: "list"
            label_singular: "Stat"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

          - label: "Programs"
            name: "programs"
            widget: "list"
            label_singular: "Program"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Testimonials (embedded Facebook posts)"
            name: "testimonials"
            widget: "list"
            required: false
            # Unlimited — no `max` set. See the About photo list above for
            # why label_singular matters here.
            label_singular: "Testimonial"
            collapsed: false
            hint: "Add as many posts as you like — there's no limit. Use \"Add Testimonial\" at the bottom of the list, and drag items to reorder them."
            fields:
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["post", "video"]
                default: "post"
                hint: "Use \"video\" for a Facebook video/reel share link (facebook.com/share/v/...), otherwise \"post\""
              - { label: "Facebook Post/Video URL", name: "url", widget: "string", hint: "Must be a public post — private or friends-only posts won't embed" }

          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - label: "Locations"
                name: "locations"
                widget: "list"
                label_singular: "Location"
                fields:
                  - { label: "Location Name", name: "name", widget: "string" }
                  - { label: "Address", name: "address", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string", required: false }
                  - { label: "Google Maps Embed URL", name: "mapEmbedSrc", widget: "string", required: false }

          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
